  <button id="fontBtn" class="toolbtn" data-action="font">Aa 字級 100%</button>
  <button id="contrastBtn" class="toolbtn" data-action="contrast" aria-pressed="false">高對比</button>

 <footer class="footer"><span>以小米的案例，練習讓支持走進日常。</span><span><button class="textbtn" data-action="sources">教材來源與使用說明</button>　<span aria-hidden="true">·</span>　不限時，隨時可以休息</span></footer>

<script>const STAGES = [
 {name:'釐清狀況，評估需求',short:'看見需求',desc:'先理解孩子遇到的參與障礙。',icon:'eye'},
 {name:'對話討論，確認措施',short:'一起討論',desc:'逐項找出有效且可執行的支持。',icon:'chat'},
 {name:'執行調整，追蹤檢討',short:'讓支持持續',desc:'把共識寫清楚，也留下調整的空間。',icon:'leaf'}
];
// 案例依使用者提供《合理調整示例》投影片 2–16 改編。
// 對話、選項、提示與回訪情境是教學設計，並非真實個案紀錄。
const MISSIONS = [
 {id:'welcome',stage:0,title:'一個請求，從被聽見開始',tag:'受理請求',pages:'2–4',
  story:'小米即將進入幼兒園。她有第一型糖尿病，還不能獨立完成血糖管理。家長說：「希望園方一起想辦法，讓她安全參與每天的活動。」',simple:'小米需要成人協助照護。家長希望幼兒園一起討論，讓她能參與活動。',
  quote:'「我可以先跟誰說這件事？」',speaker:'小米的家長',question:'你會引導家長從哪裡開始？',
  options:[{id:'teacher',title:'先向導師表達需求',text:'導師協助聯繫園內受理窗口。',ok:true,feedback:'可以。導師聽到需求後，應協助銜接受理窗口與後續評估，讓請求有明確的負責人。'}, {id:'head',title:'先向園長表達需求',text:'園長協助確認受理窗口與流程。',ok:true,feedback:'可以。向園長提出也是可行的起點，再由園內明確窗口協調後續流程。'}, {id:'wait',title:'等取得特殊教育身分後再談',text:'目前先不受理。',feedback:'先聽取並釐清實際參與障礙。這份案例並未把取得特殊教育身分作為啟動討論的前提。'}],
  hints:['先思考：家長的請求能否被接住？','導師與園長都可以協助銜接受理窗口。'],lesson:'提出需求的入口可以不同，後續要有明確窗口承接。',plan:'由園內受理窗口協調，記錄家長需求並說明後續流程。'},
 {id:'eligibility',stage:0,title:'看見證明背後的生活',tag:'適用對象與範圍',pages:'5–7',
  story:'家長提供重大傷病卡與診斷資料。小米需要的協助發生在用餐、午睡、體能活動及校外教學期間。',simple:'家長帶來診斷資料。小米在園內吃飯、休息和活動時需要支持。',quote:'「有這張卡，就能決定全部的調整嗎？」',speaker:'受理窗口',question:'評估時，最需要進一步了解什麼？',
  options:[{id:'card',title:'只確認證明文件種類',text:'有卡就套用同一組措施。',feedback:'文件能提供背景，但不能代替個別需求評估。相同診斷，也可能有不同的參與障礙。'}, {id:'interaction',title:'健康狀況如何與園內作息互相影響',text:'釐清哪些情境阻礙安全、平等參與。',ok:true,feedback:'正是這個方向。把長期健康狀況、年齡、作息與環境一起看，才能說清楚需要調整的地方。'}, {id:'label',title:'只確認是不是特殊教育幼兒',text:'沒有身分就不繼續了解。',feedback:'本案例的重點是長期健康狀況與園內環境形成的參與障礙，不能只靠身分標籤停止評估。'}],
  hints:['文件提供健康背景，還需要知道生活中發生什麼。','找出「孩子的狀況」和「園內環境」交互作用造成的障礙。'],lesson:'從實質參與障礙出發，才能形成個別化的支持。',plan:'依用餐、午睡、活動與校外教學情境，記錄實質參與障礙。'},
 {id:'barriers',stage:0,title:'把障礙放進一天的作息',tag:'辨識參與障礙',pages:'6–8',multi:true,correct:['meal','device','activity'],
  story:'想像小米入園的一天。團隊正在找出可以調整的規則與環境。以下為依案例延伸的練習情境。',simple:'看看幼兒園一天的安排。哪些地方需要調整？',quote:'「我們先找出卡住參與的地方。」',speaker:'引導員',question:'哪些情況值得列入需求評估？選出三項。',
  options:[{id:'meal',title:'固定點心時間，完全不能彈性調整',text:'可能影響依照護計畫及時補充食物。'}, {id:'device',title:'監測用品放得太遠，無法及時取得',text:'需要確認放置位置與取用方式。'}, {id:'activity',title:'只因糖尿病，就不能參加戶外活動',text:'參與機會受到限制。'}, {id:'cure',title:'要求園方治癒第一型糖尿病',text:'把治癒疾病作為入園目標。'}],
  success:'找到了三個能具體討論的障礙：作息彈性、用品取用與參與機會。調整目標是支持參與，不是要求園方治癒疾病。',retry:'再看看哪些是環境、規則或安排造成的障礙。治癒疾病並非本案合理調整的目標。',hints:['找可以改變的作息、環境或參與規則。','前三項都與園內安排有關；治癒疾病不是園方調整的目標。'],lesson:'把籠統的「照顧很困難」轉成可處理的情境。',plan:'評估點心彈性、用品就近取用，以及共同參與活動的支持。'},
 {id:'team',stage:0,title:'讓需要的人一起坐下來',tag:'組成對話小組',pages:'8–10',
  story:'需求牽涉教保、飲食、專業照護與緊急聯繫，導師無法單獨決定所有安排。',simple:'事情涉及不同專業，需要一起討論。',quote:'「這些事情，我一個人無法全都決定。」',speaker:'導師',question:'接下來如何組成討論團隊？',
  options:[{id:'teacher',title:'由導師獨自答應所有要求',text:'先承諾，再想辦法。',feedback:'導師的重要角色是日常觀察與協助，但涉及醫療與行政資源時，需要其他專業及決策人員共同確認。'}, {id:'family',title:'請家長自行處理所有安排',text:'園方暫時不參與。',feedback:'家長是合作伙伴，園方仍需參與支持安排，不能直接將責任全部交給家長。'}, {id:'team',title:'召集家長、教保、行政與醫療專業',text:'主任協調，必要時邀營養師與主管機關。',ok:true,feedback:'合適。由主任協調相關人員，整合家長期待、醫療建議與實際條件。也可用適齡方式了解小米的感受與意願。'}],
  hints:['誰了解孩子？誰執行日常支持？誰能提供專業與資源？','需要家長、教保人員、園方行政及醫療專業共同參與。'],lesson:'以孩子的安全與平等參與為核心，共同釐清責任。',plan:'召集家長、導師、教保員、行政與醫療專業；必要時邀營養師及主管機關。'},
 {id:'purpose',stage:1,title:'措施要能真的幫上忙',tag:'目的、必要性與有效性',pages:'10–11',
  story:'團隊提議：「設置用品空間、彈性調整點心與休息，並安排適任人員。」大家需要確認這些安排是否真正回應需求。',simple:'有了措施，還要確認是否能幫助小米參與。',quote:'「有安排了，就代表足夠嗎？」',speaker:'會議主持人',question:'哪一種檢視方式最完整？',
  options:[{id:'same',title:'只要跟其他幼兒一樣就好',text:'所有人都使用完全相同的流程。',feedback:'完全相同的流程可能留下原本的障礙。應以能否平等參與為判斷重點。'}, {id:'effective',title:'逐項連結障礙，確認必要且有效',text:'說明目的、做法與檢視方法，再確認可行性。',ok:true,feedback:'是的。與需求相關只是起點，也要檢查是否必要、是否足以處理障礙，並保留追蹤與修正的機會。'}, {id:'space',title:'只要提供一個照護空間就完成',text:'之後不必確認人員與流程。',feedback:'空間可能有幫助，但若沒有人員、取用與聯繫流程，仍可能無法處理實際需求。'}],
  hints:['想一想：措施與哪個障礙有關？是否足以消除障礙？','把目的、必要性、有效性與可行性逐項說清楚。'],lesson:'措施的名稱不等於效果，要檢查孩子是否真的能參與。',plan:'逐項記錄措施目的、對應障礙、必要性、預期效果及可行性。'},
 {id:'staffing',stage:1,title:'選擇你要練習的園所條件',tag:'情境分支',pages:'12、14–15',
  story:'簡報提醒，人員配置會影響專業照護與備援安排。選擇一種情境，接著練習協調。兩條路都可以完成任務。',simple:'選擇一種園所情境。兩種都能繼續練習。',quote:'「我們有哪些人力？還需要找哪些資源？」',speaker:'園方行政',question:'這次想練習哪一種條件？',
  options:[{id:'nurse',title:'園所有護理人員',text:'仍需確認到園時段、職責與請假備援。',ok:true,feedback:'你選擇有護理人員的情境。下一步要確認專業分工，並補上不在場時的備援。'}, {id:'no-nurse',title:'園所沒有專任護理人員',text:'需要協調醫療及主管機關資源。',ok:true,feedback:'你選擇沒有專任護理人員的情境。重點是主動協調合法、適任的照護與替代安排，並逐項處理其他支持。'}],hints:['這一題沒有對錯，選一個想練習的情境。'],lesson:'人員配置不同，協調與備援安排也要具體調整。',plan:'確認園所專業人力配置與支援時段。'},
 {id:'roles',stage:1,title:'把專業分工說清楚',tag:'法律與實務可行性',pages:'12、14–15',
  story:'本情境有護理人員，但並非每個活動時段都在場。部分需求涉及指尖採血與注射。',simple:'護理人員可能不在場，需要先確認專業分工和備援。',noNurseStory:'本情境沒有專任護理人員。小米仍需要安全參與，而指尖採血與注射等項目需要另行協調適任人員。',noNurseSimple:'沒有專任護理人員，要先協調適任人員和資源。',quote:'「誰可以執行？如果他不在，又怎麼辦？」',speaker:'家長與園方',question:'哪一份分工方向較適合帶回會議確認？',
  options:[{id:'train',title:'由導師看完示範後負責所有採血與注射',text:'有家長同意就直接執行。',feedback:'不能只憑示範或家長同意認定專業資格。侵入性操作須依個別醫療照護計畫，確認合法且適任的執行人員。'}, {id:'coordinate',title:'分開安排日常支持與專業照護',text:'依醫囑及照護計畫確認適任人員、資源與備援。',ok:true,feedback:'合適。教保人員依受訓內容觀察、陪同與聯繫；侵入性操作另由園方會同醫療專業及主管機關確認合法、適任人員。人力缺口要記錄並協調，不能把空白當作已解決。'}, {id:'reject',title:'有一項做不到，就拒絕所有支持',text:'其他飲食與活動安排也停止。',feedback:'應逐項評估。部分專業照護尚待協調，不代表用品取用、活動彈性與聯絡流程等其他措施都不能處理。'}],hints:['觀察與聯繫，和侵入性醫療操作，是否需要相同資格？','分開列出職責、專業資格、人力缺口與備援，不逕自指定導師操作。'],lesson:'專業權限、適任人員與備援都需要具體確認。',plan:'日常觀察及聯繫由受訓教保人員協助；侵入性操作依醫囑與照護計畫確認合法適任人員及備援。'},
 {id:'meal',stage:1,title:'一起找出可行的餐點安排',tag:'替代方案與責任分擔',pages:'13',
  story:'小米需要配合個別照護計畫安排飲食。有人提議：「請家長每天自備午餐，這樣最簡單。」',simple:'園方想請家長每天帶午餐。還有哪些做法要先討論？',quote:'「自備餐點，可以是唯一的入園條件嗎？」',speaker:'對話小組',question:'哪個方向比較合適？',
  options:[{id:'only',title:'直接要求家長自備，否則不入園',text:'所有額外費用由家長承擔。',feedback:'依簡報，不宜把自備午餐直接當成唯一方案或入園條件，也要避免將全部責任與費用轉給家長。'}, {id:'skip',title:'為了簡化管理，取消小米所有點心',text:'不用再討論餐點內容。',feedback:'不能用一律取消點心取代個別評估。飲食安排應與家長及醫療、營養專業討論。'}, {id:'collaborate',title:'先提供菜單，評估現有餐點如何調整',text:'與家長及專業人員討論，也可協議自備替代方案。',ok:true,feedback:'合適。先提供資訊與評估調整方式，再一起討論替代方案；自備可由雙方同意，但不應成為預設的唯一選項。'}],hints:['除了自備，現有餐點、菜單資訊與流程能否調整？','先評估園方可做的支持，再與家長協議替代方案。'],lesson:'一起找替代方案，也一起承擔支持責任。',plan:'事前提供菜單並協調飲食安排；自備餐點僅作為雙方同意的替代選項。'},
 {id:'outing',stage:1,title:'校外教學，也有小米的位置',tag:'活動參與與備援',pages:'14',
  story:'班上準備去公園。活動時間比平常長，地點也離開原本的照護空間。',simple:'班上要去公園。出發前，要確認小米的支持安排。',quote:'「我也想跟大家一起去。」',speaker:'小米（教學改編對話）',question:'出發前應如何規劃？',
  options:[{id:'exclude',title:'因為糖尿病，直接安排留在園內',text:'不用另外準備。',feedback:'不能僅因糖尿病就排除活動。應先評估支持、照護與活動調整，讓小米能共同參與。'}, {id:'prepare',title:'確認用品、人員、備援與緊急聯繫',text:'依個別計畫安排監測、點心、飲水、休息與活動強度。',ok:true,feedback:'合適。離開平日場域前，重新確認用品、執行人員、聯絡方式及就醫安排，也保留必要的休息與活動彈性。'}, {id:'same',title:'完全照一般流程，當天再看情況',text:'不事先安排用品或人員。',feedback:'新場域可能出現新的支持缺口。應在出發前確認人員、用品與緊急程序，避免臨時才發現安排不足。'}],hints:['新地點、延長時段，會讓原有支持出現哪些缺口？','出發前確認用品、人員、備援、聯絡與緊急就醫安排。'],lesson:'場域改變時，支持也要跟著到位。',plan:'校外教學及延長照顧前，重新確認人員、備援、用品、聯絡方式與緊急就醫安排。'},
 {id:'urgent',stage:1,title:'知道何時啟動專業協助',tag:'安全與緊急程序',pages:'8、13',
  story:'這是安全判斷練習：活動中，小米出現意識改變，無法安全進食。團隊已事先建立個別緊急照護流程。',simple:'練習情境：小米意識改變，不能安全吃喝。現在要啟動緊急流程。',quote:'「依已確認的緊急計畫行動。」',speaker:'引導員',question:'哪一個處理方向符合案例？',
  options:[{id:'wait',title:'等家長回電話後，再決定是否求助',text:'暫時不啟動緊急程序。',feedback:'嚴重症狀需要立即啟動已確認的緊急程序，不能因等候家長回覆而延誤求助。'}, {id:'feed',title:'立刻強行餵果汁',text:'即使不能安全吞嚥也餵食。',feedback:'意識改變或無法安全進食時，不可強行餵食或灌飲，以免嗆入。應啟動緊急程序並尋求專業協助。'}, {id:'emergency',title:'立即啟動緊急程序，聯絡119及相關人員',text:'聯絡護理人員與家長，不強行餵食。',ok:true,feedback:'正確。依事先確認的緊急計畫立即求助，不強行餵食。實際醫療處置須由適任人員依醫囑及緊急專業指示進行。'}],hints:['先確認能否安全進食，以及是否屬需立即求助的情境。','意識改變、無法安全進食時，不強行餵食，立即啟動緊急程序。'],lesson:'日常支持與緊急照護要事先區分，並確認求助流程。',plan:'依個別醫療計畫建立緊急程序與聯絡鏈；嚴重症狀立即求助，不強行餵食。'},
 {id:'burden',stage:1,title:'困難，要一項一項說清楚',tag:'比例性與過度負擔',pages:'10、15',
  story:'園方認為每日專業照護需要額外資源。用品放置、活動彈性和聯繫流程則已有初步安排。',simple:'有些支持已能安排，有些還缺專業人力。要分開評估。',quote:'「有困難的項目，怎麼繼續談？」',speaker:'會議主持人',question:'哪種決定方式較符合簡報原則？',
  options:[{id:'all',title:'只要一項困難，就全部拒絕',text:'不再討論其他可行支持。',feedback:'簡報強調各項請求分別決定。不能因一部分困難，就整體拒絕。'}, {id:'evidence',title:'逐項檢視成效、成本、人力及可用支援',text:'說明證據、評估替代方案，記錄已同意與待協調項目。',ok:true,feedback:'合適。逐項比較支持效益與資源條件，對困難項目補充資料、尋找外部資源與替代方案。以具體理由判斷，而非只說「太麻煩」。'}, {id:'promise',title:'整包答應，不必確認資源與權限',text:'先讓家長放心即可。',feedback:'支持需要能安全且實際執行。未確認資格、人員或資源就全面承諾，可能留下無法落實的缺口。'}],hints:['「覺得困難」需要哪些具體資料支持？','每項措施各自評估，也查找資源與替代方案。'],lesson:'逐項評估、逐項決定，困難項目留下協調方向。',plan:'各項措施分別記錄決定、理由、成本與人力、可用資源及替代方案。'},
 {id:'plan',stage:2,title:'把共識變成能執行的安排',tag:'執行表與資訊保護',pages:'16',multi:true,correct:['roles','schedule','review'],
  story:'會議結束前，團隊要整理一份書面執行表。請補齊能讓工作交接、持續運作的內容。',simple:'把安排寫下來，讓負責人和代理人都知道怎麼做。',quote:'「明天換人值班，也知道怎麼接手嗎？」',speaker:'教保組',question:'執行表應涵蓋哪些內容？選出三項。',
  options:[{id:'roles',title:'負責人、代理人與聯絡流程',text:'明確分工，確認緊急就醫安排。'}, {id:'schedule',title:'時間地點、用品保管與醫囑期限',text:'記錄設備、藥品、取用與有效期限。'}, {id:'review',title:'紀錄方式、檢視時間與必要知悉範圍',text:'追蹤活動參與，妥善保護醫療資訊。'}, {id:'share',title:'把完整診斷與照護資料貼在公開群組',text:'讓所有家長都收到。'}],
  success:'這些項目能支持交接與追蹤。醫療資訊只提供給有執行需要的人員，並妥善保密，不公開傳播。',retry:'再確認人員、時間用品與紀錄追蹤是否完整。公開分享完整醫療資料不符合必要知悉原則。',hints:['安排要能回答：誰做、何時做、怎麼交接、如何追蹤？','前三項都是執行表要素。醫療資料應按必要知悉原則保護。'],lesson:'清楚的分工與紀錄，讓支持不依賴單一人員。',plan:'書面記錄負責與代理人、時間地點、用品保管、醫囑期限、聯絡及緊急流程，依必要知悉保護資料。'},
 {id:'review',stage:2,title:'回到孩子的實際參與',tag:'追蹤、對話與修正',pages:'16',
  story:'回訪情境（教學改編）：小米已開始入園，但延長照顧時仍找不到備援人員，家長也對部分安排有疑慮。',simple:'小米已入園，但延長照顧時的支持仍有缺口。家長希望再討論。',quote:'「已經有計畫，為什麼還要再開會？」',speaker:'團隊成員',question:'團隊應如何繼續？',
  options:[{id:'wait',title:'等下學期固定會議再處理',text:'現在先維持原樣。',feedback:'定期檢討不能取代即時回應。支持仍有缺口或雙方有不同意見時，應再次對話並調整方案。'}, {id:'revise',title:'再開對話會議，補充資料並修正備援',text:'入園初期密集檢視，並約定定期追蹤。',ok:true,feedback:'完成了這次任務。依參與情形與實際困難修正安排；簡報建議初期密集檢視，並可書面約定至少每學期定期檢討一次。'}, {id:'signed',title:'家長已簽名，就不再更動',text:'以完成文件為結案標準。',feedback:'文件是執行工具，不能代替成效。應持續檢查參與障礙是否消除，必要時重新對話與修正。'}],
  hints:['計畫完成後，孩子是否真的能參與才是關鍵。','發現支持不足或意見不同時，要重啟對話，補資料並調整。'],lesson:'合理調整是一個持續檢視與修正的過程。',plan:'入園初期密集檢視；書面約定定期檢討，支持不足或意見不同時立即重啟對話。'}
];
</script>
<script>const KEY='inclusion-journey-v1';
const ICONS={eye:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12ZM9 12a3 3 0 1 0 6 0 3 3 0 1 0-6 0',chat:'M20 4H4v13h5l4 4v-4h7V4ZM8 9h8M8 13h5',leaf:'M5 20C3 8 11 3 21 3c0 10-5 18-16 17ZM5 20 16 9',check:'M5 12 9 16 19 6',arrow:'M5 12h14m-6-6 6 6-6 6',clock:'M12 8v5l3 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0',hint:'M8 17c0-3-3-4-3-8a7 7 0 0 1 14 0c0 4-3 5-3 8H8ZM9 21h6M9 17v-4m6 4v-4',pause:'M8 5v14M16 5v14',flag:'M5 21V3l14 2v9L5 12',download:'M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4'};
const icon=(name)=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[name]||ICONS.leaf}"/></svg>`;
const esc=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={version:1,view:'home',current:0,completed:{},attempts:{},hints:{},settings:{font:0,contrast:false,simple:false},started:false};
let storageOK=true,selected=[],feedback=null,speaking=false,lastFocus=null;
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved?.version===1){state.started=!!saved.started;state.current=Math.max(0,Math.min(MISSIONS.length-1,Number(saved.current)||0));state.settings={font:[0,1,2].includes(saved.settings?.font)?saved.settings.font:0,contrast:!!saved.settings?.contrast,simple:!!saved.settings?.simple};for(const q of MISSIONS){const entry=saved.completed?.[q.id];if(entry&&Array.isArray(entry.choices)&&isCorrect(q,entry.choices))state.completed[q.id]={choices:entry.choices,attempts:Number(entry.attempts)||1,hints:Number(entry.hints)||0};state.attempts[q.id]=Math.max(0,Number(saved.attempts?.[q.id])||0);state.hints[q.id]=Math.max(0,Math.min(q.hints.length,Number(saved.hints?.[q.id])||0));}let gap=MISSIONS.findIndex(q=>!state.completed[q.id]);if(gap>=0){for(let i=gap;i<MISSIONS.length;i++)delete state.completed[MISSIONS[i].id];state.current=Math.min(state.current,gap);}}}catch{storageOK=false;}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch{storageOK=false;}document.getElementById('saveState').textContent=storageOK?'進度保存在此瀏覽器':'本次進度暫存；請下載紀錄留存';}
function isCorrect(q,choices){return q.multi?choices.length===q.correct.length&&q.correct.every(x=>choices.includes(x)):choices.length===1&&!!q.options.find(o=>o.id===choices[0])?.ok;}
function doneCount(){return Object.keys(state.completed).length;}
function noNurse(){return state.completed.staffing?.choices[0]==='no-nurse';}
function storyFor(q){return q.id==='roles'&&noNurse()?(state.settings.simple?q.noNurseSimple:q.noNurseStory):(state.settings.simple?q.simple:q.story);}
function answerFeedback(q,choices,correct){if(q.multi)return correct?q.success:q.retry;return q.options.find(o=>o.id===choices[0])?.feedback||'';}
function say(msg){const n=document.getElementById('announce');n.textContent='';setTimeout(()=>{n.textContent=msg;},30);}
function stopRead(){if('speechSynthesis' in window)window.speechSynthesis.cancel();speaking=false;document.getElementById('readBtn').setAttribute('aria-pressed','false');document.getElementById('readBtn').querySelector('span').textContent='朗讀本頁';}
function applySettings(){document.documentElement.style.setProperty('--scale',[1,1.2,1.4][state.settings.font]);document.body.classList.toggle('high-contrast',state.settings.contrast);document.getElementById('fontBtn').textContent=`Aa 字級 ${[100,120,140][state.settings.font]}%`;document.getElementById('contrastBtn').setAttribute('aria-pressed',state.settings.contrast);document.getElementById('simpleBtn').setAttribute('aria-pressed',state.settings.simple);}
function sourceHTML(q){return `<details class="source"><summary>這一步的依據：簡報第 ${q.pages} 頁</summary><p>依使用者提供《合理調整示例》改編。選項、引導對話及提示為教學設計。${q.id==='roles'?'醫療操作的適任資格與合法性須依個別計畫，由園方會同醫療專業及主管機關確認。':''}</p>${q.id==='urgent'?'<a href="https://health99.hpa.gov.tw/storage/pdf/materials/21713-1.pdf" target="_blank" rel="noopener">國健署《糖尿病與我》（另開分頁）</a>':''}</details>`;}
function renderHome(){const n=doneCount();return `<div class="home-grid"><section class="home-copy"><div class="eyebrow">一段關於平等參與的練習</div><h1>小米的第一天，<br>我們<span>一起準備。</span></h1><p class="lead">扮演幼兒園的協調人，陪團隊看見需求、討論調整，讓每個孩子都有一起參與的位置。</p><div class="meta"><span>${icon('flag')}13 個情境任務</span><span>${icon('clock')}不限時・可重試</span></div><div class="start-row"><button class="primary wide" data-action="start">${n===MISSIONS.length?'查看我的行動筆記':state.started?'繼續我的任務':'開始情境任務'}${icon('arrow')}</button>${state.started?`<span class="quiet">已完成 ${n} / 13 個情境</span>`:'<span class="quiet">適合教保與教育工作者</span>'}</div></section><section class="case-scene" aria-label="小米的案例介紹"><div class="case-sheet"><div class="sheet-label"><span>CASE 01 · 情境檔案</span>${icon('leaf')}</div><h2>認識小米</h2><p class="quote">「我想和大家一起<br>吃點心、玩遊戲、去公園。」</p><p>小米即將入園。她有第一型糖尿病，需要成人協助照護。家長與園方，準備一起找到合適的支持。</p><div class="case-person"><div class="avatar" aria-hidden="true">米</div><div><strong>這次的共同目標</strong><small>安全、平等地參與幼兒園生活</small></div></div></div><div class="stamp">從「如何一起參與」開始</div></section></div><section aria-labelledby="routeTitle"><div class="route-title"><h2 id="routeTitle">你的任務路線</h2><span class="quiet">三個階段，逐步完成</span></div><div class="route">${STAGES.map((s,i)=>`<div class="route-item"><span class="route-number">0${i+1}</span><div><h3>${s.name}</h3><p>${s.desc}</p></div></div>`).join('')}</div></section><p class="notice">依《合理調整示例》改編。遊戲用於流程與原則的學習，案例對話為教學改寫。完成後可下載行動筆記，帶回團隊討論。</p>`;}
function renderSidebar(q){return `<aside class="sidebar" aria-label="任務進度"><div class="progress-head"><span>我的任務進度</span><strong>${doneCount()} / 13</strong></div><div class="progress-track" role="progressbar" aria-label="已完成情境" aria-valuemin="0" aria-valuemax="13" aria-valuenow="${doneCount()}"><div style="width:${doneCount()/13*100}%"></div></div><div class="chapter-nav">${STAGES.map((s,i)=>{const all=MISSIONS.filter(x=>x.stage===i),cnt=all.filter(x=>state.completed[x.id]).length;return `<div class="chapter ${q.stage===i?'active':''} ${cnt===all.length?'done':''}" ${q.stage===i?'aria-current="step"':''}><div class="chapter-num">${cnt===all.length?'✓':`0${i+1}`}</div><div><strong>${s.short}</strong><small>${cnt} / ${all.length} 個情境完成</small></div></div>`}).join('')}</div><div class="sidebar-note">${icon('leaf')}　慢慢來，也沒關係<p>你可以使用提示、重新選擇，或隨時休息。每一次思考都算數。</p><p>Tab 移動焦點<br>Enter 或空白鍵操作</p></div></aside>`;}
function renderMission(){const q=MISSIONS[state.current],complete=state.completed[q.id];const h=state.hints[q.id]||0;return `<div class="game-grid">${renderSidebar(q)}<div><div class="mission-top"><span class="step-label">階段 ${q.stage+1} / 3　·　${q.tag}</span><button class="textbtn" data-action="pause">${icon('pause')} 休息一下</button></div><article class="mission-card"><div class="eyebrow">情境 ${String(state.current+1).padStart(2,'0')} / 13</div><h1>${q.title}</h1><p class="story">${storyFor(q)}</p><div class="speech"><p>${q.quote}</p><small>${q.speaker}</small></div><h2 class="question" id="question">${q.question}<div class="selection-note">${q.multi?'可複選。選擇後按「確認我的選擇」。':'選擇一個方向，再確認。'}</div></h2><div class="options ${q.multi?'multi':''}" role="group" aria-labelledby="question">${q.options.map((o,i)=>`<button class="option" data-choice="${o.id}" aria-pressed="${selected.includes(o.id)}" ${complete?'disabled':''}><span class="letter" aria-hidden="true">${selected.includes(o.id)?'✓':String.fromCharCode(65+i)}</span><span><strong>${o.title}</strong><small>${o.text}</small></span></button>`).join('')}</div>${!complete?`<div class="choice-footer"><button class="hintbtn" data-action="hint">${icon('hint')}${h?'再看一個提示':'給我一點提示'} <span class="quiet">${h} / ${q.hints.length}</span></button><button class="primary" data-action="submit" ${!selected.length?'disabled':''}>確認我的選擇 ${icon('arrow')}</button></div>`:''}${h?`<div class="hint" role="note"><strong>提示 ${h}</strong><br>${q.hints[h-1]}</div>`:''}${feedback?`<section id="feedback" class="feedback ${feedback.ok?'':'retry'}" tabindex="-1" aria-labelledby="feedbackTitle"><h3 id="feedbackTitle">${icon(feedback.ok?'check':'hint')}${feedback.ok?(q.id==='staffing'?'情境已選好':'這個思考方向很重要'):'再想一步，你可以重新選擇'}</h3><p>${feedback.text}</p>${feedback.ok?`<p class="lesson">${q.lesson}</p><button class="primary" data-action="next">${state.current===MISSIONS.length-1?'完成任務，查看行動筆記':MISSIONS[state.current+1].stage!==q.stage?'進入下一階段':'繼續下一個情境'} ${icon('arrow')}</button>`:'<p class="quiet" style="margin-top:12px">沒有扣分。你可以看提示，再選一次。</p>'}</section>`:''}</article><div class="under-card">${sourceHTML(q)}<button class="textbtn" data-action="previous" ${state.current===0?'disabled':''}>← 回看上一個情境</button></div></div></div>`;}
function planRows(){return [
 ['共同目標','支持小米安全、平等參與用餐、午睡、室內外活動與校外教學。'],
 ['受理與需求','由園內明確窗口協調，從健康狀況與作息、環境的交互影響，記錄參與障礙及家長期待。'],
 ['日常支持','協調用品就近取用、菜單資訊、點心與休息彈性；活動前後依計畫觀察，教保人員依受訓內容陪同與聯繫。'],
 ['本次人力情境',noNurse()?'無專任護理人員：園方會同醫療專業與主管機關協調合法、適任的執行人員、外部支援與替代安排。未解決的人力缺口需明確記錄。':'有護理人員：確認到園時段、職責及醫囑範圍，並確認請假、延長照顧與校外活動的合法適任備援。'],
 ['專業與緊急照護','採血、注射等依個別醫療照護計畫確認合法適任人員，不逕自指定導師操作。建立緊急聯絡與就醫流程，嚴重症狀立即求助，不強行餵食。'],
 ['逐項確認措施','逐項檢視目的、相關性、必要性、有效性、合法與實務可行性及負擔；保留成本、人力、可用支援與替代方案的具體資料。'],
 ['執行表待補欄位','每項措施的負責人／代理人、時間／地點、設備與藥品保管、紀錄方式、醫囑有效期限、家長與醫療聯絡方式、緊急就醫流程。請由實際團隊確認。'],
 ['追蹤與資料保護','入園初期密集檢視；可書面約定至少每學期定期檢討一次。支持不足或意見不同時再開對話會議。醫療資料依必要知悉原則提供並保密。']
 ];}
function renderResult(){return `<div class="result"><section class="result-hero"><div class="success-symbol">${icon('leaf')}</div><div class="eyebrow" style="justify-content:center">三個階段，已完成</div><h1>你已為一起參與，<br>整理好下一步。</h1><p>把學到的原則，帶回下一次團隊討論。</p><div class="result-actions"><button class="primary" data-action="download">${icon('download')}下載行動筆記</button><button class="secondary" data-action="print">列印／另存 PDF</button><button class="secondary" data-action="records">回看學習紀錄</button></div></section><article class="passport" id="passport"><div class="passport-header"><div><h2>小米的入園支持 · 行動筆記</h2><small>依本次情境路線整理　·　已完成 ${doneCount()} / 13</small></div><span class="draft-tag">教學草稿・待團隊確認</span></div><div class="passport-seals">${STAGES.map(s=>`<span class="seal">${icon('check')}${s.short}</span>`).join('')}</div>${planRows().map(([title,body])=>`<div class="plan-row"><strong>${title}</strong><p>${body}</p></div>`).join('')}</article><div class="result-note"><p>這份筆記是學習成果，尚未填入真實人員、醫囑與聯絡資訊。用於實際個案前，請由園方、家長與醫療專業共同確認各項安排。</p><p style="margin-top:12px">你也可以重新開始，練習另一種人力情境。</p><button class="textbtn" data-action="restart">重新開始任務 →</button></div><details class="source"><summary>教材與參考來源</summary><p>主要教材：使用者提供《合理調整示例》第 2–16 頁。場景與引導對話經教學改編。</p><a href="https://nhrc.cy.gov.tw/cp.aspx?n=9889" target="_blank" rel="noopener">國家人權委員會合理調整參考指引</a><a href="https://health99.hpa.gov.tw/storage/pdf/materials/21713-1.pdf" target="_blank" rel="noopener">國健署《糖尿病與我》</a></details></div>`;}
function render(focusMain=true,focusSelector=null){stopRead();applySettings();document.getElementById('main').innerHTML=state.view==='home'?renderHome():state.view==='result'?renderResult():renderMission();persist();if(focusSelector){document.querySelector(focusSelector)?.focus({preventScroll:true});}else if(focusMain){document.getElementById('main').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}}
function openMission(index){state.view='mission';state.current=index;const q=MISSIONS[index],c=state.completed[q.id];selected=c?[...c.choices]:[];feedback=c?{ok:true,text:answerFeedback(q,c.choices,true)}:null;render();}
function showDialog(title,body,actions=''){stopRead();lastFocus=document.activeElement;const d=document.getElementById('modal');d.innerHTML=`<div class="dialog-head"><h2 id="modalTitle">${title}</h2><button class="close" data-action="close" aria-label="關閉視窗">✕</button></div>${body}${actions?`<div class="dialog-actions">${actions}</div>`:''}`;if(!d.open)d.showModal();}
function closeDialog(){document.getElementById('modal').close();lastFocus?.focus?.();}
function showRecords(){showDialog('我的學習紀錄',`<p>已完成 ${doneCount()} / 13 個情境。提示與重試都是學習的一部分，不計排名。</p><ul class="record-list">${MISSIONS.map((q,i)=>{const c=state.completed[q.id];return `<li>${c?`<button data-review="${i}">${String(i+1).padStart(2,'0')}　${q.title}</button>`:`<div>${String(i+1).padStart(2,'0')}　${q.title}</div>`}<span>${c?`已完成 · 確認 ${c.attempts} 次${c.hints?` · 提示 ${c.hints}`:''}`:'尚未完成'}</span></li>`}).join('')}</ul>`,`<button class="secondary" data-action="export">下載紀錄 JSON</button><button class="textbtn" data-action="restart">重新開始</button>`);}
function downloadFile(name,text,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);say('檔案已準備下載。');}
function exportRecords(){const result={title:'一起入園｜合理調整學習紀錄',exportedAt:new Date().toISOString(),completed:doneCount(),total:13,staffing:state.completed.staffing?(noNurse()?'無專任護理人員':'有護理人員'):'尚未選擇',records:MISSIONS.map(q=>({title:q.title,stage:STAGES[q.stage].name,completed:!!state.completed[q.id],choices:(state.completed[q.id]?.choices||[]).map(id=>q.options.find(x=>x.id===id)?.title),attempts:state.attempts[q.id]||0,hints:state.hints[q.id]||0,sourcePages:q.pages})),note:'教學練習紀錄，非醫療紀錄或正式個案評估。'};downloadFile('一起入園_學習紀錄.json',JSON.stringify(result,null,2),'application/json;charset=utf-8');}
function readPage(){if(speaking){stopRead();return;}if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){showDialog('此環境未提供語音朗讀','<p>你仍可使用頁面文字、簡明文字或螢幕閱讀器。可改用支援語音合成的瀏覽器。</p>');return;}const q=MISSIONS[state.current];const text=state.view==='mission'?`${q.title}。${storyFor(q)}。${q.quote}。${q.question}。${q.options.map((o,i)=>`${String.fromCharCode(65+i)}。${o.title}。${o.text}`).join('。')}。${feedback?.text||''}`:document.getElementById('main').innerText;const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';u.rate=.88;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>/zh[-_]TW/i.test(v.lang))||voices.find(v=>/^zh/i.test(v.lang))||null;u.onend=()=>{speaking=false;document.getElementById('readBtn').setAttribute('aria-pressed','false');document.getElementById('readBtn').querySelector('span').textContent='朗讀本頁';};u.onerror=(e)=>{stopRead();if(e.error!=='interrupted'&&e.error!=='canceled')showDialog('朗讀暫時無法播放','<p>目前瀏覽器未能播放語音。請使用文字內容、簡明文字或螢幕閱讀器繼續。</p>');};speaking=true;document.getElementById('readBtn').setAttribute('aria-pressed','true');document.getElementById('readBtn').querySelector('span').textContent='停止朗讀';speechSynthesis.speak(u);}
document.addEventListener('click',e=>{const choice=e.target.closest('[data-choice]');if(choice){const q=MISSIONS[state.current];if(state.completed[q.id])return;const id=choice.dataset.choice;if(q.multi){selected=selected.includes(id)?selected.filter(x=>x!==id):[...selected,id];}else selected=[id];feedback=null;render(false,`[data-choice="${id}"]`);say(q.multi?`已選擇 ${selected.length} 項`:`已選擇：${q.options.find(x=>x.id===id).title}`);return;}const review=e.target.closest('[data-review]');if(review){closeDialog();openMission(Number(review.dataset.review));return;}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,q=MISSIONS[state.current];if(a==='home'){state.view='home';render();}else if(a==='start'){state.started=true;if(doneCount()===MISSIONS.length){state.view='result';render();}else{openMission(MISSIONS.findIndex(x=>!state.completed[x.id]));}}else if(a==='font'){state.settings.font=(state.settings.font+1)%3;applySettings();persist();say(`字級 ${[100,120,140][state.settings.font]}%`);}else if(a==='contrast'){state.settings.contrast=!state.settings.contrast;applySettings();persist();}else if(a==='simple'){state.settings.simple=!state.settings.simple;render(false);say(state.settings.simple?'已使用簡明情境文字':'已使用完整情境文字');}else if(a==='read'){readPage();}else if(a==='hint'){state.hints[q.id]=Math.min(q.hints.length,(state.hints[q.id]||0)+1);render(false,'[data-action="hint"]');say(q.hints[state.hints[q.id]-1]);}else if(a==='submit'){if(!selected.length)return;const ok=isCorrect(q,selected);state.attempts[q.id]=(state.attempts[q.id]||0)+1;if(ok)state.completed[q.id]={choices:[...selected],attempts:state.attempts[q.id],hints:state.hints[q.id]||0};feedback={ok,text:answerFeedback(q,selected,ok)};render(false);document.getElementById('feedback')?.focus({preventScroll:true});document.getElementById('feedback')?.scrollIntoView({block:'nearest',behavior:'instant'});say(ok?'此情境已完成。可以繼續下一步。':'請閱讀回饋，重新選擇。');}else if(a==='next'){if(!state.completed[q.id])return;if(state.current===MISSIONS.length-1){state.view='result';render();}else openMission(state.current+1);}else if(a==='previous'){if(state.current>0)openMission(state.current-1);}else if(a==='close'){closeDialog();}else if(a==='pause'){showDialog('休息一下，依自己的步調',`<p>你已完成 ${doneCount()} 個情境。休息不影響進度，準備好再繼續。</p><p class="quiet">${storageOK?'進度已保存在此瀏覽器。共用裝置可先下載紀錄，結束後再重新開始清除本次紀錄。':'瀏覽器無法保存進度，關閉頁面前請先下載紀錄。'}</p>`,`<button class="primary" data-action="close">我準備好了，繼續</button><button class="secondary" data-action="export">下載紀錄</button>`);}else if(a==='help'){showDialog('怎麼進行這段練習？','<p>你是幼兒園的協調人。依案例做選擇，練習把合理調整落實在每天的生活。</p><ol><li>閱讀每個情境，也可按「朗讀本頁」聆聽。</li><li>選擇後按「確認我的選擇」，閱讀原因與提示。</li><li>完成三階段，取得可下載的行動筆記。</li></ol><p>不限時、不扣分，答錯可重試。部分題目有不只一個可行方向；「有／無護理人員」會影響後續情境。</p><p><strong>依你的需要：</strong>字級可切換 100%、120%、140%；高對比與簡明文字可隨時切換。使用 Tab 移動、Enter 或空白鍵操作，無須拖曳。可由陪伴者代讀、代點，讓參與者表達自己的選擇。</p><p class="quiet">朗讀使用瀏覽器與裝置提供的語音服務，可用性依環境而異。</p>');}else if(a==='sources'){showDialog('教材來源與使用說明','<p><strong>主要教材</strong><br>使用者提供《合理調整示例》第 2–16 頁。保留「釐清狀況評估需求、對話討論確認措施、執行調整追蹤檢討」流程。案例對話、選項、提示與回訪事件為教學改編。</p><p><strong>補充核對</strong><br><a href="https://nhrc.cy.gov.tw/cp.aspx?n=9889" target="_blank" rel="noopener">國家人權委員會《身心障礙者合理調整參考指引》</a><br><a href="https://health99.hpa.gov.tw/storage/pdf/materials/21713-1.pdf" target="_blank" rel="noopener">國民健康署《糖尿病與我》</a></p><p>這是流程與原則的學習遊戲。實際醫療處置、適任資格與個別照護安排，需由園方會同家長、醫療專業及必要的主管機關確認。遊戲不提供用藥劑量或注射操作教學。</p><p><strong>進度與隱私</strong><br>遊戲不要求填寫姓名、健康資料或聯絡方式。作答與閱讀設定儲存在此瀏覽器；程式沒有將作答紀錄上傳。語音由瀏覽器服務提供。清除網站資料會移除進度。</p>');}else if(a==='records'){showRecords();}else if(a==='export'){exportRecords();}else if(a==='download'){const text='一起入園｜小米的入園支持行動筆記\n教學草稿・待實際團隊確認\n\n'+planRows().map(([h,t])=>h+'\n'+t).join('\n\n')+'\n\n待確認欄位（請逐項補齊）\n措施：________\n負責人：________　代理人：________\n時間／地點：________\n設備與藥品保管：________\n醫囑有效期限：________\n紀錄方式：________\n聯絡及緊急就醫流程：________\n下次檢視日期：________\n\n主要教材：《合理調整示例》第2–16頁\n本筆記是教學練習成果，不能代替個別醫療照護計畫。\n';downloadFile('一起入園_行動筆記.txt','\uFEFF'+text,'text/plain;charset=utf-8');}else if(a==='print'){stopRead();window.print();}else if(a==='restart'){showDialog('重新開始這次練習？','<p>這會清除本瀏覽器內目前的作答與提示紀錄，保留閱讀設定。你可以先下載紀錄，再練習另一條情境路線。</p>','<button class="secondary" data-action="export">先下載紀錄</button><button class="primary" data-action="reset-confirm">清除紀錄，重新開始</button><button class="textbtn" data-action="close">取消</button>');}else if(a==='reset-confirm'){const settings=state.settings;state={version:1,view:'home',current:0,completed:{},attempts:{},hints:{},settings,started:false};selected=[];feedback=null;closeDialog();render();}});
document.getElementById('modal').addEventListener('close',()=>lastFocus?.focus?.());
window.addEventListener('pagehide',stopRead);
render(false);
</script>
</body></html>
